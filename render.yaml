# Render Blueprint Specification for BrandSentry AI
# Docs: https://render.com/docs/blueprint-spec
services:
  # ---------------------------------------------------------------------------
  # Backend Web Service (FastAPI + ChromaDB + ONNX Embeddings)
  # ---------------------------------------------------------------------------
  - type: web
    name: brandsentry-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    region: oregon
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "8000"
      - key: DATA_DIR
        value: /app/backend/data
      - key: ALLOWED_ORIGINS
        value: https://brandsentry-web.onrender.com,http://localhost:5173
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: LLM_API_KEY
        sync: false
      - key: VERDICT_SIMILARITY_THRESHOLD
        value: "0.25"

  # ---------------------------------------------------------------------------
  # Frontend Static Site (React + TypeScript + Vite)
  # Free, fast global CDN delivery with automatic SPA route rewrites.
  # ---------------------------------------------------------------------------
  - type: web
    name: brandsentry-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://brandsentry-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
